  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }
    html.dark body {
      background: #1e1e1e;
    }
    #vditor {
      height: 100%;
    }
    .vditor {
      border: 0 !important;
      border-radius: 0 !important;
      background: transparent;
    }
    /* Notion 风格正文排版 */
    .vditor-wysiwyg .vditor-reset {
      font-family: -apple-system, "SF Pro Text", "PingFang SC", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 16px;
      line-height: 1.7;
      padding: 16px 20px 48px !important;
      color: #37352f;
    }
    html.dark .vditor-wysiwyg .vditor-reset {
      color: #e8e6e3;
    }
    .vditor-reset h1 {
      font-size: 1.75em;
      font-weight: 700;
      margin: 0.7em 0 0.4em;
      letter-spacing: -0.01em;
    }
    .vditor-reset h2 {
      font-size: 1.4em;
      font-weight: 650;
      margin: 0.65em 0 0.35em;
      letter-spacing: -0.01em;
    }
    .vditor-reset h3 {
      font-size: 1.18em;
      font-weight: 600;
      margin: 0.6em 0 0.3em;
    }
    .vditor-reset p {
      margin: 0.4em 0;
    }
    .vditor-reset blockquote {
      margin: 0.5em 0;
      padding: 2px 0 2px 14px;
      border-left: 3px solid rgba(120, 120, 120, 0.35);
      color: rgba(55, 53, 47, 0.75);
    }
    html.dark .vditor-reset blockquote {
      color: rgba(232, 230, 227, 0.72);
    }
    .vditor-reset pre {
      border-radius: 10px;
      background: rgba(128, 128, 128, 0.08);
      padding: 12px 14px;
      margin: 0.6em 0;
      font-size: 0.92em;
      line-height: 1.55;
    }
    html.dark .vditor-reset pre {
      background: rgba(255, 255, 255, 0.07);
    }
    .vditor-wysiwyg table {
      width: 100%;
      font-size: 0.94em;
      margin: 0.6em 0;
      border-collapse: collapse;
    }
    .vditor-wysiwyg th, .vditor-wysiwyg td {
      padding: 6px 10px;
      border: 1px solid rgba(120, 120, 120, 0.25);
    }
    .vditor-wysiwyg ul, .vditor-wysiwyg ol {
      padding-left: 1.4em;
    }
    .vditor-wysiwyg li {
      margin: 0.2em 0;
    }
    .vditor-wysiwyg hr {
      border: 0;
      border-top: 1px solid rgba(120, 120, 120, 0.3);
      margin: 1em 0;
    }
    /* 代码块语言输入条 */
    .vditor-wysiwyg__block .vditor-wysiwyg__preview,
    .vditor-wysiwyg__block pre {
      font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    /* Notion 风格 / 菜单 */
    .marknote-slash {
      position: fixed;
      z-index: 1000;
      width: 264px;
      max-height: 330px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.07);
      border-radius: 14px;
      box-shadow: 0 12px 38px rgba(0, 0, 0, 0.18);
      padding: 6px;
      box-sizing: border-box;
    }
    html.dark .marknote-slash {
      background: #2a2a2a;
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 38px rgba(0, 0, 0, 0.45);
    }
    .marknote-slash__item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 8px 10px;
      border-radius: 9px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .marknote-slash__item--active {
      background: rgba(80, 120, 255, 0.11);
    }
    html.dark .marknote-slash__item--active {
      background: rgba(110, 150, 255, 0.18);
    }
    .marknote-slash__icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: rgba(120, 120, 120, 0.12);
      color: #4a7bff;
      font-weight: 600;
      font-size: 14px;
      flex: none;
    }
    html.dark .marknote-slash__icon {
      background: rgba(255, 255, 255, 0.1);
      color: #7ba3ff;
    }
    .marknote-slash__label {
      font-size: 14.5px;
      color: #37352f;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    html.dark .marknote-slash__label {
      color: #e8e6e3;
    }
    .marknote-slash__empty {
      padding: 16px 12px;
      text-align: center;
      font-size: 13px;
      color: rgba(120, 120, 120, 0.9);
    }

    /* 隐藏 Vditor 内置的元素属性小面板（图片 URL/替代文本/标题、链接等），
       它在手机上会显示成 “id《alt+eng》” 之类的奇怪小标签或空白输入框，
       格式功能已由应用自己的工具栏和 / 菜单提供。 */
    .vditor-wysiwyg > .vditor-panel[data-top] {
      display: none !important;
    }

    var LANG = 'en_US';
    try {
      if (Android && Android.getLanguage) {
        var l = Android.getLanguage();
        if (l === 'zh' || l === 'zh_CN') LANG = 'zh_CN';
        else if (l === 'fr' || l === 'fr_FR') LANG = 'fr_FR';
        else if (l === 'de' || l === 'de_DE') LANG = 'de_DE';
        else if (l === 'ja' || l === 'ja_JP') LANG = 'ja_JP';
        else if (l === 'es' || l === 'es_ES') LANG = 'es_ES';
        else LANG = 'en_US';
      }
    } catch (e) {}

    // Android WebView 在首次布局前加载页面时，html/body 的 height:100% 会被解析成 0，
    // 之后即使 WebView 尺寸恢复正常也不会自动更新，导致编辑器只剩顶部一小条、其余白屏。
    // 这里强制用视口像素高度重建布局，并监听尺寸变化（含软键盘弹出/收起、模式切换）。
    function markNoteFixHeight() {
      var h = window.innerHeight;
      if (!h || h <= 0) return;
      var hpx = h + 'px';
      document.documentElement.style.height = hpx;
      document.body.style.height = hpx;
      var host = document.getElementById('vditor');
      if (host) host.style.height = hpx;
    }
    window.__markNoteFixHeight = markNoteFixHeight;
    window.addEventListener('resize', markNoteFixHeight);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', markNoteFixHeight);
    }
    document.addEventListener('DOMContentLoaded', markNoteFixHeight);
    window.addEventListener('load', markNoteFixHeight);

    var SLASH_ITEMS = SLASH_BY_LANG[LANG] || SLASH_BY_LANG['en_US'];

    function slashAction(id) {
      switch (id) {
        case 'h1': return function () { markNoteHeading(1); };
        case 'h2': return function () { markNoteHeading(2); };
        case 'h3': return function () { markNoteHeading(3); };
        case 'bold': return function () { markNoteExec('bold'); };
        case 'italic': return function () { markNoteExec('italic'); };
        case 'strikethrough': return function () { markNoteExec('strike'); };
        case 'code': return function () { markNoteExec('inline-code'); };
        case 'codeblock': return function () { markNoteExec('code'); };
        case 'quote': return function () { markNoteExec('quote'); };
        case 'bullet': return function () { markNoteExec('list'); };
        case 'ordered': return function () { markNoteExec('ordered-list'); };
        case 'task': return function () { markNoteExec('check'); };
        case 'link': return function () { markNoteExec('link'); };
        case 'image': return function () {
          try { Android.pickImage(); } catch (e) { markNoteInsert('![](https://)'); }
        };
        case 'table': return function () { markNoteExec('table'); };
        case 'hr': return function () { markNoteExec('line'); };
        default: return function () {};
      }
    }

    var slashMenu = document.getElementById('marknote-slash');
    var slashState = null;   // { block, items, sel }
    var slashTimer = 0;
    var slashBound = false;

    function getSlashBlock(node) {
      var el = node && node.nodeType === 1 ? node : (node ? node.parentElement : null);
      if (!el) return null;
      return el.closest('[data-block="0"]');
    }

    /** 计算当前是否处于行首 /query 状态；是则返回块与查询词 */
    function computeSlash() {
      var sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return null;
      var range = sel.getRangeAt(0);
      if (!range.collapsed) return null;
      var block = getSlashBlock(range.startContainer);
      if (!block) return null;
      var before = document.createRange();
      before.selectNodeContents(block);
      before.setEnd(range.startContainer, range.startOffset);
      var text = before.toString();
      var m = /^\/([\p{L}\p{N}]*)$/u.exec(text);
      if (!m) return null;
      var rect = range.getBoundingClientRect();
      return { block: block, query: m[1], rect: rect };
    }

    function renderSlash(state) {
      var q = state.query.toLowerCase();
      var items = SLASH_ITEMS.filter(function (c) {
        return !q || c.keywords.toLowerCase().indexOf(q) > -1 || c.id.toLowerCase().indexOf(q) > -1;
      });
      state.items = items;
      state.sel = 0;
      if (items.length === 0) {
        slashMenu.innerHTML = '<div class="marknote-slash__empty">' +

        slashMenu.style.display = 'block';
      } else {
        var html = '';

            '<span class="marknote-slash__icon">' + c.icon + '</span>' +
            '<span class="marknote-slash__label">' + c.label + '</span></div>';
        });
        slashMenu.innerHTML = html;
        slashMenu.style.display = 'block';
        slashMenu.querySelectorAll('.marknote-slash__item').forEach(function (el, i) {
          el.addEventListener('pointerdown', function (ev) {
            ev.preventDefault();
            runSlashCommand(items[i]);
          });
        });
      }
      positionSlash(state.rect);
    }

    function positionSlash(rect) {
      if (!rect) return;
      var menuH = slashMenu.offsetHeight || 300;
      var left = Math.max(8, Math.min(rect.left, window.innerWidth - 272));
      var top = rect.bottom + 6;
      if (top + menuH > window.innerHeight - 8) {
        top = Math.max(8, rect.top - menuH - 6);
      }
      slashMenu.style.left = left + 'px';
      slashMenu.style.top = top + 'px';
    }

    function updateSlash() {
      var state = computeSlash();
      if (!state) {
        hideSlash();
        return;
      }
      slashState = state;
      renderSlash(state);
    }

    function hideSlash() {
      slashState = null;
      slashMenu.style.display = 'none';
      slashMenu.innerHTML = '';
    }

    function runSlashCommand(item) {
      var state = slashState;
      hideSlash();
      if (!state) return;
      var sel = window.getSelection();
      var range = sel && sel.rangeCount ? sel.getRangeAt(0) : null;
      // 删除行首到光标的 /query
      if (range) {
        var del = document.createRange();
        del.selectNodeContents(state.block);
        del.setEnd(range.startContainer, range.startOffset);
        del.deleteContents();
        // 光标放回块开头
        var r2 = document.createRange();
        var first = state.block.firstChild;
        if (first && first.nodeType === 3) {
          r2.setStart(first, 0);
        } else if (first) {
          r2.setStart(first, 0);
        } else {
          r2.selectNodeContents(state.block);
        }
        r2.collapse(true);
        sel.removeAllRanges();
        sel.addRange(r2);
      }
      slashAction(item.id)();
    }

    function bindSlash() {
      if (slashBound || !ready) return;
      var editor = vditor.vditor.wysiwyg.element;
      if (!editor) return;
      slashBound = true;

      editor.addEventListener('input', function (e) {
        if (e.isComposing) return;
        clearTimeout(slashTimer);
        slashTimer = setTimeout(updateSlash, 40);
      });

      // capture 阶段优先处理 Enter/方向键，避免与 Vditor 内部键位冲突
      editor.addEventListener('keydown', function (e) {
        if (e.isComposing || !slashState || !slashState.items || slashState.items.length === 0) return;
        if (e.key === 'Enter') {
          e.preventDefault();
          e.stopPropagation();
          runSlashCommand(slashState.items[0]);
        } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          e.stopPropagation();
          var n = slashState.items.length;
          slashState.sel = e.key === 'ArrowDown'
            ? (slashState.sel + 1) % n
            : (slashState.sel - 1 + n) % n;
          slashMenu.querySelectorAll('.marknote-slash__item').forEach(function (el, i) {
            el.classList.toggle('marknote-slash__item--active', i === slashState.sel);
          });
        } else if (e.key === 'Escape') {
          hideSlash();
        }
      }, true);

      document.addEventListener('selectionchange', function () {
        clearTimeout(slashTimer);
        slashTimer = setTimeout(updateSlash, 160);
      });

      document.addEventListener('pointerdown', function (e) {
        if (slashMenu.contains(e.target)) return;
        if (slashState) hideSlash();
      });
    }

    // ---------- Vditor 初始化 ----------

    var options = {
      mode: 'wysiwyg',
      lang: LANG,
      i18n: window.VditorI18n,
      cdn: 'file:///android_asset/vditor',
      value: '',
      _lutePath: 'lute/lute.min.js',
      placeholder: UI.placeholder,
      height: '100%',
      cache: { enable: false },
      undoDelay: 200,
      icon: '',
      toolbar: [
        'undo', 'redo', '|',
        'headings', 'bold', 'italic', 'strike', '|',
        'inline-code', 'code', 'quote', 'list', 'ordered-list', 'check',
        'line', 'link', 'table'
      ],
      toolbarConfig: { hide: true },
      customWysiwygToolbar: function () {},
      preview: {
        hljs: { enable: false, style: 'github' },
        theme: { current: 'light', path: 'css' },
        maxWidth: 640
      },
      hint: {
        delay: 60,
        emojiPath: 'images/emoji'
      },
      input: function (md) {
        try { Android.onContentChanged(md); } catch (e) {}
      },
      after: function () {
        ready = true;
        bindSlash();
        markNoteFixHeight();
        if (pendingDark) {
          applyDark(true);
          pendingDark = false;
        }
        try { Android.onReady(); } catch (e) {}
      }
    };

    vditor = new Vditor('vditor', options);
    window.__vditor = vditor;

    function applyDark(dark) {
      document.documentElement.classList.toggle('dark', dark);
      vditor.setTheme(dark ? 'dark' : 'classic', dark ? 'dark' : 'light', null, 'css');
    }

    // ---------- Android -> JS 桥 ----------

    window.setMarkNoteContent = function (md) {
      if (!ready) return;
      if (vditor.getValue() !== md) {
        vditor.setValue(md, true);
      }
    };

    window.focusMarkNote = function () {
      if (ready) vditor.focus();
    };

    window.setMarkNoteDark = function (dark) {
      if (!ready) {
        pendingDark = !!dark;
        return;
      }
      applyDark(!!dark);
    };

    window.markNoteExec = function (name) {
      if (!ready) return;
      var el = vditor.vditor.toolbar.elements[name];
      if (!el) return;
      var btn = el.querySelector('button, div');
      if (!btn) return;
      // 显式命令不受 Vditor 自动上下文禁用影响（例如光标曾经过代码块后列表按钮未恢复）
      btn.classList.remove('vditor-menu--disabled');
      btn.click();
    };

    window.markNoteHeading = function (level) {
      if (!ready) return;
      var el = vditor.vditor.toolbar.elements.headings;
      if (!el) return;
      var btn = el.querySelector('button');
      if (!btn) return;
      btn.classList.remove('vditor-menu--disabled');
      btn.click();
      var panel = el.querySelector('.vditor-hint');
      if (panel && panel.children[level - 1]) {
        panel.children[level - 1].classList.remove('vditor-menu--disabled');
        panel.children[level - 1].click();
      }
    };

    window.markNoteInsert = function (md) {
      if (!ready) return;
      vditor.insertValue(md);
    };

    window.markNoteUndo = function () {
      if (ready) window.markNoteExec('undo');
    };

    window.markNoteRedo = function () {
      if (ready) window.markNoteExec('redo');
    };
  </script>
</body>
</html>
